<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ActuJeune - L'info jeune du Cameroun</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#f8fafc;color:#0f172a}
header{background:#0f172a;color:white;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:1.5rem} .logo span{color:#f59e0b}
nav a{color:white;margin-left:1rem;text-decoration:none}
.hero{background:linear-gradient(135deg,#0f172a,#1e40af);color:white;padding:4rem 2rem;text-align:center}
.hero h1{font-size:2.5rem;margin-bottom:1rem} .btn{display:inline-block;background:#f59e0b;color:black;padding:.8rem 1.5rem;border-radius:8px;text-decoration:none;font-weight:700;margin-top:1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.5rem;padding:2rem;max-width:1200px;margin:0 auto}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 4px 6px rgba(0,0,0,.1)}
.badge{background:#fef3c7;color:#92400e;padding:.2rem .6rem;border-radius:99px;font-size:.7rem;font-weight:700}
.status{background:#dcfce7;color:#166534;padding:.8rem 1rem;border-radius:8px;margin:1rem auto;max-width:1200px;text-align:center;font-weight:700}
</style></head><body>
<header><div class="logo">Actu<span>Jeune</span></div><nav><a href="/docs">API</a><a href="/api/health">Health</a></nav></header>
<div class="hero"><h1>L'actualité jeune du Cameroun</h1><p>Info, culture, sport, tech - 100% jeune</p><a class="btn" href="/api/posts">Voir les articles</a></div>
<div class="status">✅ Site LIVE sur Vercel - Fix 29 Sep</div>
<div class="grid" id="posts">Chargement...</div>
<script>fetch('/api/posts').then(r=>r.json()).then(posts=>{const g=document.getElementById('posts');if(!posts.length||posts.error){g.innerHTML='<p style="padding:2rem">API OK. Ajoute des articles via /docs</p>';return}g.innerHTML=posts.slice(0,6).map(p=>`<div class="card"><div style="height:180px;background:linear-gradient(135deg,#ddd,#999)"></div><div style="padding:1rem"><span class="badge">${p.category||'Actu'}</span><h3 style="margin:.5rem 0">${p.title}</h3><p style="opacity:.7">${(p.summary||'').slice(0,100)}...</p></div></div>`).join('')}).catch(e=>document.getElementById('posts').innerHTML='API: '+e)</script>
</body></html>
