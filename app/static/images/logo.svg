<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <!-- Gradients for Cameroon Colors -->
    <linearGradient id="cmGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008744"/>
      <stop offset="100%" stop-color="#005a2c"/>
    </linearGradient>
    <linearGradient id="cmRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#ce1126"/>
    </linearGradient>
    <linearGradient id="cmGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <style>
      .logo-title-actu { fill: #0f172a; }
      @media (prefers-color-scheme: dark) {
        .logo-title-actu { fill: #f8fafc; }
      }
    </style>
  </defs>

  <!-- Modern Icon Symbol -->
  <g transform="translate(10, 10)" filter="url(#subtleDrop)">
    <!-- Stylized Modern Letter "A" for Actu -->
    <path d="M 50 10 L 80 90 L 64 90 L 53 58 L 33 58 L 26 80 L 12 80 Z" fill="url(#cmGreenGrad)" />
    
    <!-- Red Broadcast / Pulse Waves for "News / Actu" & Youth Voice -->
    <path d="M 55 42 A 16 16 0 0 1 68 56" fill="none" stroke="url(#cmRedGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 57 32 A 28 28 0 0 1 78 57" fill="none" stroke="url(#cmRedGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 60 22 A 40 40 0 0 1 89 58" fill="none" stroke="url(#cmRedGrad)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Central Gold Star of Unity ⭐ -->
    <polygon points="46,38 49,46 58,46 51,51 54,59 46,54 38,59 41,51 34,46 43,46" fill="url(#cmGoldGrad)" filter="url(#subtleDrop)"/>
  </g>

  <!-- Typography: ActuJeune -->
  <text x="115" y="60" class="logo-title-actu" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" letter-spacing="-1">
    Actu<tspan fill="#008744">jeune</tspan>
  </text>
  
  <!-- Subtitle: La Voix de la Jeunesse 237 -->
  <text x="116" y="82" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#ce1126" letter-spacing="1.5">
    🇨🇲 LE MÉDIA DE LA JEUNESSE 237
  </text>
</svg>
